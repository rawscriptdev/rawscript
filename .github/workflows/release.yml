name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Verify version sync
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$PKG_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match input (${{ github.event.inputs.version }})"
            exit 1
          fi

      - run: pnpm build
      - run: pnpm sbom

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/rawscript.js
            packages/cli/dist/cli.mjs
            SBOM.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: rawscript v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/rawscript.js
            packages/cli/dist/cli.mjs
            SBOM.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}