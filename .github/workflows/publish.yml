name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Verify packed contents
        run: |
          pnpm pack --dry-run 2>&1 | head -20
          pnpm pack --dry-run 2>&1 | grep -E 'rawscript\.js|rawscript-sw\.js|cli\.mjs' || exit 1

      - name: Publish to npm with provenance
        run: pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}